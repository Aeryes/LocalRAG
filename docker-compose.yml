services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_container
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: always

  ollama-puller:
    image: ollama/ollama:latest
    container_name: ollama_puller
    environment:
      - OLLAMA_HOST=ollama:11434
    command: pull llama3:8b
    depends_on:
      ollama:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant_container
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always

  filebrowser:
    image: filebrowser/filebrowser:v2.48.0
    container_name: file_manager
    user: "0:0"
    ports:
      - "8080:80"
    environment:
      - FB_NOAUTH=true
    volumes:
      - shared_data:/srv
      - filebrowser_db:/database
      - filebrowser_config:/config
    restart: always

  app:
    build: .
    container_name: rag_app
    ports:
      - "8501:8501"
      - "6006:6006"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - QDRANT_URL=http://qdrant:6333
      - PHOENIX_HOST=0.0.0.0
      - PHOENIX_PORT=6006
    depends_on:
      ollama-puller:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    volumes:
      - .:/app
      - shared_data:/app/docs # App looks at the EXACT SAME shared named volume

volumes:
  ollama_storage:
  qdrant_storage:
  shared_data:
  filebrowser_db:
  filebrowser_config:
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_container
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  ollama-puller:
    image: ollama/ollama:latest
    container_name: ollama_puller
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "llama3.1:8b"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  neo4j:
    image: neo4j:5
    container_name: neo4j_container
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-password}
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_container
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  filebrowser:
    image: filebrowser/filebrowser:v2.61.2
    container_name: file_manager
    user: "0:0"
    ports:
      - "8080:80"
    environment:
      FB_NOAUTH: "true"
    command:
      [
        "--noauth",
        "--address",
        "0.0.0.0",
        "--port",
        "80",
        "--root",
        "/srv",
        "--database",
        "/database/filebrowser.db"
      ]
    volumes:
      - shared_data:/srv
      - filebrowser_db:/database
      - filebrowser_config:/config
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: postgres_container
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis_container
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  app:
    build: .
    container_name: rag_app
    env_file:
      - .env
    ports:
      - "8000:8000"
      - "6006:6006"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      PHOENIX_HOST: 0.0.0.0
      PHOENIX_PORT: 6006
      REDIS_URL: redis://redis:6379/0
    depends_on:
      ollama:
        condition: service_healthy
      ollama-puller:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
      neo4j:
        condition: service_started
      postgres:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - .:/app
      - shared_data:/app/docs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  ollama_storage:
  qdrant_storage:
  neo4j_data:
  shared_data:
  filebrowser_db:
  filebrowser_config:
  postgres_data:
  redis_data: